name: Build Quest APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build-tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Godot, export templates and Android build template
        run: bash tools/setup_godot.sh

      - name: Build debug APK
        run: bash tools/build_apk.sh debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: threshold-quest-apk
          path: build/threshold.apk
          if-no-files-found: error
